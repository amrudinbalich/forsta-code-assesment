<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Taco Truck Co.</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
        
        <!-- font awesome icons  -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
        
        <!-- Handlebars JS Lib -->
        <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>

        <!-- google maps -->
        <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCh3U0gPmzNNwefWvxNgtBjtqhj67XKbb4&callback=initMap&libraries=maps,marker,geometry&loading=async" defer async></script>

        <!-- page assets -->
        <link rel="stylesheet" href="styles/styles.css">
    </head>

    <body>

        <div class="container mt-5">

            <!-- Map and Addresses Layout -->
            <main class="row">
                <div id="addresses" class="col-md-5 d-md-pe-3 border border-secondary"></div>
                <div id="map" class="col-md-7"></div>
            </main>

        </div>

        <script type="text/javascript" src="scripts/map.js"></script>
        <script type="text/javascript" src="scripts/addresses.js"></script>

        <script>
            /** custom page script **/

            // tooltip
            document.addEventListener('DOMContentLoaded', function () {
                const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
                tooltipTriggerList.forEach(el => {
                    new bootstrap.Tooltip(el);
                });
            });
        </script>

    </body>
</html>
